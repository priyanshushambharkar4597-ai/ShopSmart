name: ShopSmart CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # 1. FRONTEND: LINT & BUILD
  # =========================================================
  frontend-ci:
    name: Frontend (React 19 + Vite + Oxlint)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Oxlint Linter
        run: npm run lint

      - name: Build Production Assets
        run: npm run build

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

      - name: Deploy to GitHub Pages (gh-pages branch)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  # =========================================================
  # 2. BACKEND: COMPILE & VERIFY C + DATA STRUCTURES SERVER
  # =========================================================
  backend-ci:
    name: Backend (C11 + SQLite3 + microhttpd + CMake)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Tools & Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            libsqlite3-dev \
            libmicrohttpd-dev

      - name: Configure CMake
        run: |
          cmake -B backend/build -S backend \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build C Binary
        run: |
          cmake --build backend/build

      - name: Verify Executable Integrity
        run: |
          if [ -f "backend/build/shopsmart" ]; then
            echo "Binary verification passed: backend/build/shopsmart exists and is executable."
            ls -lh backend/build/shopsmart
          else
            echo "Error: backend/build/shopsmart binary not found!"
            exit 1
          fi

      - name: Upload Backend Executable
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary-linux
          path: backend/build/shopsmart
          retention-days: 7

  # =========================================================
  # 3. NATIVE GITHUB PAGES DEPLOYMENT
  # =========================================================
  deploy-pages:
    name: Deploy Native GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [ frontend-ci ]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

